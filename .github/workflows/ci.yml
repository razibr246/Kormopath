name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Browser journeys
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm start -- -p 3100 > server.log 2>&1 &
          node tests/e2e/wait-for-server.mjs
          npm run test:browser
