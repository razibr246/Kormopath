<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>
    
    <!-- Road Arrow Fiery Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Blue Glow Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Midnight Rounded Square -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Blue Vertical Stem of K -->
  <rect x="11" y="24" width="7" height="23" rx="2" fill="url(#blueGrad)"/>

  <!-- Open Book at the bottom (White) -->
  <path d="M 12 49 Q 22 44 32 48 Q 42 44 52 49 L 50 46 Q 41 42 32 45 Q 23 42 14 46 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 15 50 Q 23 46 32 49 Q 41 46 49 50" stroke="#007aff" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Ascending Road Path & Arrow (Orange / Amber) -->
  <!-- Lower leg of K / road entry -->
  <path d="M 16 46 C 24 38 28 34 33 30 C 37 36 43 43 51 47 L 46 47 C 40 43 36 38 32 33 C 28 37 23 41 16 46 Z" fill="url(#arrowGrad)"/>

  <!-- Upper leg: Ascending Road curving into Arrow -->
  <path d="M 18 43 C 25 36 29 28 36 21 L 43 14 L 38 12 L 53 11 L 51 26 L 47 21 L 39 27 C 32 33 27 39 20 45 Z" fill="url(#arrowGrad)"/>

  <!-- Road Center Dashes -->
  <path d="M 23 41 C 28 34 32 28 39 22" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2.5 2" stroke-linecap="round"/>

  <!-- Brain & Intelligence Node on Top Left -->
  <g transform="translate(18, 11) scale(0.65)">
    <!-- Brain Silhouette -->
    <path d="M 10 18 C 6 18 3 15 3 11 C 3 8 5 6 8 5 C 9 2 13 1 16 3 C 18 1 23 2 24 5 C 27 6 29 8 29 11 C 29 15 26 18 22 18 Z" fill="#ffffff"/>
    <path d="M 16 7 L 16 16" stroke="#007aff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 12 Q 13 10 16 12 Q 19 10 22 12" stroke="#007aff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Glowing Mind Rays (Sunburst Orange) -->
  <line x1="39" y1="12" x2="43" y2="8" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="16" x2="47" y2="14" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
</svg>
